<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendário Editorial</title>
<style>
/* Layout: poster-style header with a glitched wordmark, then a horizontal kanban of tall dark columns. One committed dark look. */
:root{
  --ink:#08090b; --panel:#101216; --panel-2:#171a20; --line:#262b33;
  --ice:#e6ecf2; --steel:#8c99a8; --red:#ff3b17; --blue:#4a63ff;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"Space Mono","SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{background:var(--ink);color:var(--ice);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(120,150,190,.22),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;color:var(--steel)}
.top .cap{max-width:190px;line-height:1.35}
.top .cap.r{text-align:right}
.arrows{color:var(--red);font-size:16px;display:block;margin-bottom:6px}
.hero{position:relative;margin:18px 0 10px;overflow:hidden;padding-block:6px}
.word{font-family:var(--display);font-size:clamp(76px,19vw,250px);line-height:.92;text-transform:uppercase;letter-spacing:.005em;margin:0;position:relative;display:block;color:var(--ice)}
.word span{display:block;position:relative;width:fit-content}
.word .o{color:transparent;-webkit-text-stroke:2px var(--ice)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:var(--red);mix-blend-mode:screen;clip-path:inset(18% 0 62% 0);transform:translateX(-6px);animation:g1 5s steps(1) infinite}
.glitch::after{color:var(--blue);mix-blend-mode:screen;clip-path:inset(64% 0 12% 0);transform:translateX(6px);animation:g2 5s steps(1) infinite}
@keyframes g1{0%,86%{clip-path:inset(18% 0 62% 0)}88%{clip-path:inset(4% 0 80% 0);transform:translateX(-12px)}92%{clip-path:inset(46% 0 38% 0);transform:translateX(-4px)}96%,100%{clip-path:inset(18% 0 62% 0)}}
@keyframes g2{0%,84%{clip-path:inset(64% 0 12% 0)}87%{clip-path:inset(70% 0 4% 0);transform:translateX(12px)}93%{clip-path:inset(30% 0 52% 0);transform:translateX(4px)}97%,100%{clip-path:inset(64% 0 12% 0)}}
.streaks{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 12%,rgba(255,255,255,.55) 12.4%,transparent 16%,transparent 61%,rgba(255,59,23,.6) 61.3%,transparent 64%,transparent 83%,rgba(255,255,255,.35) 83.2%,transparent 86%);
  filter:blur(5px);mix-blend-mode:screen;opacity:.55}
.sub{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px}
.stats b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;color:var(--ice);margin-right:6px;letter-spacing:.02em}
.stats b.hot{color:var(--red)}
.stats span{display:inline-flex;align-items:baseline;color:var(--steel)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--steel);border-radius:999px;padding:3px 12px;color:var(--ice);font-family:var(--mono);font-size:11px;letter-spacing:.04em}

/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding:20px 2px 18px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 min(320px,84vw);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--steel);display:flex;flex-direction:column;min-width:0;scroll-snap-align:start}
.col.hot{border-top-color:var(--red)}
.col.blue{border-top-color:var(--blue)}
.col.done{border-top-color:var(--ice)}
.col-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 14px 4px}
.col-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
.col-h .n{font-family:var(--mono);font-size:12px;color:var(--steel)}
.col-note{padding:0 14px 10px;color:var(--steel);min-height:26px}
.list{display:flex;flex-direction:column;gap:10px;padding:4px 10px 10px;min-height:70px}
.list.over{background:rgba(255,59,23,.06)}
.drop{height:3px;background:var(--red);margin:-2px 0}
.card{background:var(--panel-2);border:1px solid var(--line);padding:12px 12px 10px;cursor:grab;position:relative;min-width:0}
.card:hover{border-color:var(--steel)}
.card.dragging{opacity:.35}
.card-top{display:flex;justify-content:space-between;align-items:center;color:var(--steel);margin-bottom:6px}
.card h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:23px;line-height:1.08;text-transform:uppercase;letter-spacing:.015em;overflow-wrap:anywhere}
.card p{margin:0 0 10px;color:var(--steel);font-size:13px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{border:1px solid var(--line);padding:1px 8px;color:var(--ice);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px}
.tag.rec{background:var(--red);border-color:var(--red);color:#fff}
.prog{height:3px;background:var(--line);margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--red)}
.card-b{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--steel)}
.who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mv{display:flex;gap:4px;flex:none}
.mv button{background:none;border:1px solid var(--line);color:var(--ice);width:28px;height:26px;line-height:1;padding:0}
.mv button:hover{border-color:var(--red);color:var(--red)}
.mv button:disabled{opacity:.25;cursor:default;border-color:var(--line);color:var(--ice)}
.add{margin:0 10px 12px;background:none;border:1px dashed var(--line);color:var(--steel);padding:8px;text-align:left}
.add:hover{border-color:var(--red);color:var(--ice)}
.addf{margin:0 10px 12px;display:flex;gap:6px}
.addf input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--steel);padding:7px 9px}
.addf button{background:var(--red);border:0;color:#fff;padding:0 12px}

.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;margin-top:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);color:var(--steel);padding:5px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px}
.chip:hover{border-color:var(--steel);color:var(--ice)}
.chip.on{background:var(--ice);border-color:var(--ice);color:var(--ink)}
.tag.wk{border-color:var(--blue);color:var(--ice)}
.spk{color:var(--ice);margin-bottom:8px}
.thumb{position:relative;margin:-12px -12px 10px;aspect-ratio:16/9;overflow:hidden;background:var(--ink);border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:8px;bottom:8px;background:var(--ink);color:var(--ice);padding:2px 8px;font-size:10px}
.styl img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin-top:8px;border:1px solid var(--line)}
.styl dl{margin:10px 0 0;display:grid;gap:2px}
.styl dt{color:var(--red);margin-top:6px}
.styl dd{margin:0;font-size:13px;color:var(--ice);line-height:1.4}
.msg{color:var(--steel);min-height:16px;margin-top:8px}
.cal{display:flex;flex-direction:column;gap:12px;overflow-x:auto;padding:20px 2px 18px}
.cal>*{min-width:760px}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;color:var(--steel);padding:0 2px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--panel);border:1px solid var(--line);min-height:116px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0}
.day.off{background:transparent;border-color:transparent}
.day.today{border-color:var(--red)}
.day.over{background:rgba(255,59,23,.1);border-color:var(--red)}
.dn{color:var(--steel)}
.day.today .dn{color:var(--red)}
.cchip{background:var(--panel-2);border:1px solid var(--steel);border-left:3px solid var(--red);padding:4px 7px;text-align:left;font-size:12px;line-height:1.3;cursor:grab;min-width:0;overflow-wrap:anywhere}
.cchip:hover{border-color:var(--red)}
.cchip b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);display:block;font-weight:400}
.unsched{border:1px dashed var(--steel);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.unsched.over{background:rgba(255,59,23,.1);border-color:var(--red)}
.unsched .row{gap:8px}
.unsched .cchip{border-left-color:var(--steel);max-width:260px}
.lbars{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.lbars span{height:8px;width:36px;border-radius:2px;display:block}
.cover-b{width:100%;max-height:300px;object-fit:cover;display:block;margin:6px 0 12px;border:1px solid var(--line)}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.att{border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;min-width:0}
.att img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.att .fl{padding:10px;font-size:13px;overflow-wrap:anywhere;color:var(--ice)}
.ab{display:flex;justify-content:space-between;gap:4px;padding:4px}
.ab button{background:none;border:1px solid var(--line);color:var(--ice);font-family:var(--mono);font-size:10px;padding:3px 8px;text-transform:uppercase}
.ab button:hover{border-color:var(--red);color:var(--red)}
.ab button.on{background:var(--red);border-color:var(--red);color:#fff}
.cmt{border-left:2px solid var(--blue);padding-left:10px;color:var(--steel)}
.cmt p{margin:2px 0 0;color:var(--ice);font-size:14px;overflow-wrap:anywhere}
.lbs{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px}
.lrow input[type=checkbox]{accent-color:var(--red);width:16px;height:16px;margin:0;flex:none}
.lrow .sw{width:22px;height:22px;border-radius:3px;flex:none}
.lrow .f{padding:5px 8px}
.ppl{margin-top:14px;border:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
.ppl .row{gap:8px}
.pchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--steel);padding:4px 4px 4px 12px;border-radius:999px}
.pchip b{font-weight:500}
.pchip i{font-style:normal;color:var(--steel);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.pchip button{background:none;border:0;color:var(--steel);width:24px;height:24px;line-height:1;border-radius:50%}
.pchip button:hover{color:var(--red)}
.ppl .addf{margin:0;max-width:360px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pk{background:none;border:1px solid var(--line);color:var(--steel);padding:3px 10px;border-radius:999px;font-size:12px}
.pk:hover{border-color:var(--steel);color:var(--ice)}
.pk.on{background:var(--ice);border-color:var(--ice);color:var(--ink)}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:6px}
.prow>.mono{color:var(--steel);font-size:10px;width:44px;flex:none}
.pc{padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.55}
.pc.free{background:var(--line);color:var(--ice);font-weight:400}
.pc.none{background:transparent;border:1px dashed var(--line);color:var(--steel);font-weight:400}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.pchip input[type=color]{width:20px;height:20px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}
/* modal */
.veil{position:fixed;inset:0;background:rgba(4,5,7,.82);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--steel);width:min(980px,100%);margin-top:4vh;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.m-main{padding:22px 24px;border-right:1px solid var(--line);min-width:0}
.m-side{padding:22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.m-head{display:flex;justify-content:space-between;color:var(--steel);margin-bottom:8px}
.m-close{background:none;border:1px solid var(--line);color:var(--ice);padding:2px 10px;font-family:var(--mono);font-size:11px}
.m-close:hover{border-color:var(--red);color:var(--red)}
.m-title{width:100%;background:none;border:0;border-bottom:1px solid transparent;font-family:var(--display);font-size:clamp(34px,6vw,54px);line-height:1;text-transform:uppercase;padding:0 0 6px;letter-spacing:.01em}
.m-title:hover,.m-title:focus{border-bottom-color:var(--line);outline:none}
.script{margin-top:14px;display:flex;flex-direction:column;gap:10px;max-width:62ch}
.script p{margin:0;font-size:16px;line-height:1.55}
.script .sp{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.script .sp em{font-style:normal;color:var(--red);padding-top:4px}
.script .dir{color:var(--steel);font-family:var(--mono);font-size:12px;border-left:2px solid var(--blue);padding-left:10px}
.script .fmt{color:var(--steel);font-style:italic}
.script textarea{width:100%;min-height:380px;background:var(--ink);border:1px solid var(--steel);padding:12px;line-height:1.5;resize:vertical}
.lbl{display:block;color:var(--steel);margin-bottom:5px}
.f{width:100%;background:var(--ink);border:1px solid var(--line);padding:8px 10px}
.f:focus{border-color:var(--red);outline:none}
select.f{appearance:auto}
.chk{display:flex;flex-direction:column;gap:6px}
.chk label{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);cursor:pointer;background:var(--panel-2)}
.chk input{accent-color:var(--red);width:16px;height:16px;margin:0}
.chk label.on span{color:var(--steel);text-decoration:line-through}
.btn{background:none;border:1px solid var(--steel);padding:7px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.danger.arm{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;color:var(--steel)}
@media (max-width:760px){
  .modal{grid-template-columns:minmax(0,1fr)}
  .m-main{border-right:0;border-bottom:1px solid var(--line)}
  .top .cap{max-width:140px}
}
@media (prefers-reduced-motion:reduce){.glitch::before,.glitch::after{animation:none}}
</style>

<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<header>
  <div class="top mono">
    <div class="cap"><span class="arrows">↗ ↗</span>O pequeno grupo precisa estar lá</div>
    <div class="cap r"><span class="arrows">↗</span>Sua presença importa</div>
  </div>
  <div class="hero">
    <h1 class="word">
      <span class="glitch" data-t="Calendário">Calendário</span>
      <span class="o glitch" data-t="Editorial">Editorial</span>
    </h1>
    <div class="streaks" aria-hidden="true"></div>
  </div>
  <div class="sub">
    <div class="stats mono" id="stats"></div>
    <div class="pills"><span class="pill">palavra.viva</span><span class="pill" id="sync">salvando local</span></div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="mono msg" id="msg" role="status"></div>
  <div id="people"></div>
</header>

<main>
  <div class="board" id="board" aria-label="Quadro de roteiros"></div>
</main>

<div id="modalRoot"></div>

 ["Roteiro 1","O convite do pastor","Pastor falando direto com a câmera, intercalando com imagens dos pequenos grupos reunidos.",["Pastoral"],"Pastor Gustavo",true,
`Você já parou pra pensar na diferença que você faz dentro do seu pequeno grupo?
Às vezes, a gente pensa que a nossa presença não faz tanta diferença assim, mas a verdade é que cada pessoa é importante. A comunhão acontece quando a gente escolhe caminhar junto, compartilhar a vida e crescer na presença de Deus.
E é por isso que eu quero convidar você e todo o seu pequeno grupo para viver um momento especial com a gente, assistindo The Chosen.
Vai ser uma oportunidade de estarmos juntos, aprendermos mais sobre Jesus e fortalecermos aquilo que Deus está construindo no meio de nós.
Então, não deixa pra depois! Mobiliza o seu pequeno grupo, chama a galera e vem viver esse momento com a gente.
Esperamos vocês!`],
 ["Roteiro 2","Seu pequeno grupo precisa estar lá","Integrantes do pequeno grupo falando, com cortes rápidos entre diferentes pessoas.",["Cortes rápidos"],"A definir",false,
`Pessoa 1: Ei, você que faz parte de um pequeno grupo, posso te fazer uma pergunta?
Pessoa 2: Você já imaginou como seria assistir a uma história sobre Jesus junto com as pessoas que caminham com você na fé?
Pessoa 3: Não é só sobre ir ao cinema ou assistir a um filme.
Pessoa 4: É sobre viver uma experiência diferente, estar junto de quem faz parte da sua caminhada e ter a oportunidade de conversar sobre aquilo que Deus fala com a gente.
Pessoa 1: E sabe o que deixa tudo isso ainda mais especial?
Pessoa 2: É ter você lá!
Pessoa 3: Então já manda esse vídeo no grupo do seu pequeno grupo.
Todos: Bora pro The Chosen! Esperamos vocês!`],
 ["Roteiro 3","Você faz falta","Emocional, com cenas de pessoas se cumprimentando, abraçando e reunidas na igreja.",["Emocional"],"A definir",false,
`Talvez você pense que, se não for, não vai fazer tanta diferença assim.
Mas deixa eu te falar uma coisa: você faz falta!
O seu pequeno grupo não é formado apenas por pessoas que se encontram durante a semana. É formado por pessoas que escolhem caminhar juntas, que compartilham momentos, que crescem na fé e que aprendem umas com as outras.
E os momentos que vivemos juntos também fazem parte dessa caminhada.
Por isso, queremos convidar você para assistir The Chosen com a gente.
Não queremos que você apenas fique sabendo que aconteceu. Queremos que você esteja lá, vivendo esse momento com seus irmãos, criando memórias e fortalecendo a nossa comunhão.
Então, chama seu pequeno grupo, organiza a galera e vem com a gente!
Sua presença importa.`],
 ["Roteiro 4","O pequeno grupo que nunca consegue marcar nada","Humor, conversas encenadas e cortes rápidos.",["Humor"],"Jovens",true,
`Pessoa 1: Família, precisamos marcar alguma coisa pra fazer juntos!
Pessoa 2: Bora! Tô dentro!
Pessoa 3: Eu também! Só falar o dia.
Pessoa 1: Fechou! Que tal todo mundo ir assistir The Chosen?
Pessoa 2: Peraí, vai ser quando?
Pessoa 3: Quem vai?
Pessoa 4: Onde vai ser?
Pessoa 1: Gente, calma! É só se organizar!
[Corte mostrando alguém olhando para a câmera, sem acreditar.]
Pessoa 1: Brincadeiras à parte, família, essa é uma oportunidade muito especial pra gente estar junto, fortalecer nossa comunhão e viver algo diferente com o nosso pequeno grupo.
Pessoa 2: Então, dessa vez, nada de só mandar mensagem no grupo e sumir!
Pessoa 3: Já chama todo mundo e bora pro The Chosen!
Pessoa 1: Contamos com vocês, hein!`],
 ["Roteiro 5","Mais do que assistir a um filme","Cinematográfico, com cenas da série e imagens dos pequenos grupos juntos.",["Cinematográfico"],"A definir",false,
`E se esse fosse um daqueles momentos que você vai lembrar por muito tempo?
A gente passa a semana inteira na correria, com compromissos, responsabilidades e tantas coisas pra resolver.
Mas também precisamos separar um tempo para aquilo que realmente importa.
Estar perto de pessoas que compartilham da mesma fé, fortalecer nossos relacionamentos e aprender mais sobre Jesus.
E é isso que queremos viver juntos assistindo The Chosen.
Imagine assistir à história de Jesus e depois poder conversar com as pessoas do seu pequeno grupo sobre o que mais chamou sua atenção, o que te marcou e o que você aprendeu.
É uma oportunidade de viver algo diferente, em comunhão, com pessoas que fazem parte da sua caminhada.
Então, não fica de fora! Reúne seu pequeno grupo e vem viver esse momento com a gente.`],
 ["Roteiro 6","A igreja é feita de pessoas","Várias pessoas da igreja completando a mesma mensagem, com fechamento coletivo.",["Comunidade"],"Várias pessoas da igreja",true,
`Pessoa 1: Quando a gente fala sobre igreja, não estamos falando apenas de um lugar.
Pessoa 2: Estamos falando de pessoas.
Pessoa 3: Pessoas que caminham juntas.

async function syncGcal(){

  if(!ids.length){msg("Defina a data de postagem de pelo menos um roteiro.");return}
  syncing=true;var made=0,upd=0,same=0;

    for(var i=0;i<ids.length;i++){

      if(c.gcal&&c.gcal.sig===sig){same++;continue}

      var desc=["Etapa: "+COLS[colOf(ids[i])].name,"Quem grava: "+(c.who||"A definir")];if(c.speaker)desc.push("Quem fala: "+c.speaker);
      var sy=styleOf(c.style);if(sy)desc.push("Estilo: "+sy.name);
      var body={summary:"Postar: "+c.title,startTime:w.start,endTime:w.end,allDay:w.allDay,description:desc.join("<br>")};
      if(!w.allDay)body.overrideReminders=[{method:"popup",minutes:60},{method:"popup",minutes:1440}];
